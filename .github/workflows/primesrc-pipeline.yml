name: PrimeSrc Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_stage1:
        description: 'Skip Stage 1'
        required: false
        type: boolean
        default: false
      skip_stage2:
        description: 'Skip Stage 2 (only collect keys, no FlareSolverr)'
        required: false
        type: boolean
        default: false
      media_type:
        description: 'Media type (movie or tv)'
        required: false
        type: choice
        options:
          - movie
          - tv
        default: movie

permissions:
  contents: write

jobs:
  extract-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── FlareSolverr ──────────────────────────────────────────────
      # Pulls the official image and starts it on port 8191.
      # No Cloudflare challenge is expected on /api/v1/l — FlareSolverr
      # just provides a fresh browser session so the site doesn't block
      # the plain HTTP request.
      - name: Start FlareSolverr
        run: |
          docker pull ghcr.io/flaresolverr/flaresolverr:latest
          docker run -d \
            --name flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest

      - name: Wait for FlareSolverr to be ready
        run: |
          echo "Waiting for FlareSolverr health endpoint..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s http://localhost:8191/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
            if [ "$STATUS" = "ok" ]; then
              echo "FlareSolverr is ready (attempt $i)"
              break
            fi
            echo "  attempt $i — not ready yet, sleeping 2s..."
            sleep 2
          done
          # Final verification
          curl -sf http://localhost:8191/health || (echo "FlareSolverr failed to start" && exit 1)

      # ── Python (no extra deps — stdlib only) ─────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # No third-party packages needed

      - name: Create input file if not exists
        run: |
          if [ ! -f "tmdb_movie_input_list.txt" ]; then
            echo "# Add your PrimeSrc embed URLs here, one per line" > tmdb_movie_input_list.txt
            echo "# Example: https://primesrc.me/embed/movie?tmdb=12345" >> tmdb_movie_input_list.txt
          fi

      # ── Run the pipeline ─────────────────────────────────────────
      - name: Run PrimeSrc Pipeline
        run: |
          CMD="python dolkana.py"

          if [ "${{ github.event.inputs.skip_stage1 }}" = "true" ]; then
            CMD="$CMD --skip-stage1"
          fi

          if [ "${{ github.event.inputs.skip_stage2 }}" = "true" ]; then
            CMD="$CMD --skip-stage2"
          fi

          if [ -n "${{ github.event.inputs.media_type }}" ]; then
            CMD="$CMD --type ${{ github.event.inputs.media_type }}"
          fi

          echo "Running: $CMD"
          $CMD
        env:
          FLARESOLVERR_URL: http://localhost:8191
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: danka1567/primesrc_data
          GH_BRANCH: main
        continue-on-error: true

      # ── Collect FlareSolverr logs on failure ─────────────────────
      - name: FlareSolverr logs (on failure)
        if: failure()
        run: docker logs flaresolverr || true

      # ── Commit & push all input/output files back to main repo ───
      # Every file produced (or updated) by the pipeline is committed
      # directly into this repo so results persist across runs and are
      # always visible in the repository without downloading artifacts.
      - name: Save all pipeline files to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all base and auto-split output files
          git add tmdb_movie_input_list*.txt 2>/dev/null || true
          git add lastet_released_holly_bolly_movies_list*.txt 2>/dev/null || true
          git add output_stage1_api_urls_list_found*.txt 2>/dev/null || true
          git add output_stage1_api_urls_list_not_found*.txt 2>/dev/null || true
          git add final_stream_urls_stage2*.txt 2>/dev/null || true
          git add movie_streaming_data*.json 2>/dev/null || true
          git add already_processed_urls_list*.txt 2>/dev/null || true
          git add errorsfaced*.txt 2>/dev/null || true

          # Commit only if there is something new to commit
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Pipeline run: update output files [$(date -u '+%Y-%m-%dT%H:%M:%SZ')]"
            git push origin HEAD:main
            echo "Files committed and pushed to main."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── GitHub sync is handled inside dolkana.py (Stage 3) ──────
      # The script calls the GitHub Contents API directly to push
      # movie_streaming_data.json (and -2, -3 … if > 20 MB) to srtfile/movie-data.
